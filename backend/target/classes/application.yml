server:
  port: 8080

spring:
  application:
    name: citywalk-backend
  datasource:
    url: ${MYSQL_URL:}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

amap:
  web-key: ${AMAP_WEB_KEY:}
  base-url: ${AMAP_BASE_URL:}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:}
  base-url: ${DEEPSEEK_BASE_URL:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:}
  base-url: ${GEMINI_BASE_URL:}

mission-verify-ai:
  api-key: ${MISSION_VERIFY_AI_API_KEY:${AI_API_KEY:}}
  model: ${MISSION_VERIFY_AI_MODEL:${AI_VISION_MODEL:}}
  base-url: ${MISSION_VERIFY_AI_BASE_URL:${AI_BASE_URL:}}
  request-timeout-ms: ${MISSION_VERIFY_AI_REQUEST_TIMEOUT_MS:${AI_REQUEST_TIMEOUT_MS:2200}}

wechat:
  open:
    app-id: ${WECHAT_OPEN_APP_ID:}
    app-secret: ${WECHAT_OPEN_APP_SECRET:}
    callback-url: ${WECHAT_OPEN_CALLBACK_URL:}
    frontend-base-url: ${WECHAT_OPEN_FRONTEND_BASE_URL:}

jwt:
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:}
  access-expire-seconds: ${JWT_ACCESS_EXPIRE_SECONDS:}
  refresh-expire-seconds: ${JWT_REFRESH_EXPIRE_SECONDS:}
